name: Stage 10 V2b manuscript construction and referee-visible build
on:
  push:
    paths:
      - 'paper/**'
      - 'production/**'
      - 'docs/V2B_THEORY_FREEZE_2026-10-21_v1.md'
      - 'formal/V2bWelfareCore.lean'
      - 'verification/v2b_stage07_welfare_institutions.py'
      - '.github/workflows/stage10-manuscript.yml'
  pull_request:
  workflow_dispatch:
jobs:
  source-consistency:
    name: Stage10 citations, claims and theorem bridge presence
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: production/requirements-stage9.txt
      - run: python -m pip install -r production/requirements-stage9.txt
      - name: Guard Stage8 exact frozen source/proof blobs
        run: make freeze
      - name: Reproduce audited national welfare table
        run: |
          make table
          make table-check
      - name: Audit citations, references and theorem bridges
        run: python production/scripts/check_stage10_manuscript.py
  reviewer-pdf:
    name: Build Stage10 first substantive manuscript PDF
    runs-on: ubuntu-latest
    needs: source-consistency
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: production/requirements-stage9.txt
      - run: python -m pip install -r production/requirements-stage9.txt
      - name: Install exact documented production LaTeX stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern latexmk poppler-utils
      - name: Rebuild bibliography, dynamic table and full PDF
        run: make paper
      - name: Refuse missing citations/references in final LaTeX log
        run: |
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined' paper/build/main.log; then
            echo "Unresolved final PDF bibliography or theorem reference"
            exit 1
          fi
      - name: Check final PDF text contains manuscript arguments and is not a shell
        run: |
          pdfinfo paper/build/main.pdf | grep '^Pages:'
          test -s paper/build/main.pdf
          pdftotext paper/build/main.pdf paper/build/main.txt
          grep -qi 'endogenous product design' paper/build/main.txt
          grep -qi 'frozen-design' paper/build/main.txt
          grep -qi 'rational-interval' paper/build/main.txt
          if grep -qi 'Stage 10 section reserved' paper/build/main.txt; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          import subprocess
          info=subprocess.check_output(['pdfinfo','paper/build/main.pdf'],text=True)
          pages=int(re.search(r'^Pages:\s*(\d+)',info,re.M).group(1))
          print('Manuscript page count:',pages)
          assert 10 <= pages <= 80
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2b-stage10-first-full-draft-not-submission-ready
          path: paper/build/main.pdf
          retention-days: 7
