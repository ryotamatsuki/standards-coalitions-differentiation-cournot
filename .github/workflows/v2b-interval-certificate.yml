name: V2b continuous policy interval certificate
on:
  push:
    paths:
      - 'verification/v2b_interval_reversal_certificate.py'
      - 'verification/requirements_v2b_interval.txt'
      - '.github/workflows/v2b-interval-certificate.yml'
  pull_request:
jobs:
  rigorous-inequality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r verification/requirements_v2b_interval.txt
      - name: Certify all integration depths with rational intervals
        run: python -u verification/v2b_interval_reversal_certificate.py
