name: V2b numerical continuation audit
on:
  push:
    paths:
      - 'verification/v2b_policy_numeric.py'
      - 'verification/requirements_v2b.txt'
      - '.github/workflows/v2b-policy-numeric.yml'
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r verification/requirements_v2b.txt
      - name: Check illustrative equilibria
        run: python verification/v2b_policy_numeric.py
