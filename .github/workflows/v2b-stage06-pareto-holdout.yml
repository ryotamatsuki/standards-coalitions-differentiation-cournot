name: V2b Stage 6 Pareto holdout audit
on:
  push:
    paths:
      - 'verification/v2b_stage06_pareto_holdout.py'
      - '.github/workflows/v2b-stage06-pareto-holdout.yml'
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interval arithmetic
        run: python -m pip install 'mpmath>=1.3,<2'
      - name: Prove strict welfare gains at rational compatibility depth
        run: python verification/v2b_stage06_pareto_holdout.py
