name: Symbolic algebra audit
on:
  push:
  pull_request:
jobs:
  algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install math dependencies
        run: python -m pip install -r requirements.txt
      - name: Check archived equations and witness
        run: python verification/symbolic_audit.py
