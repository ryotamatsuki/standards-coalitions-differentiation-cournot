name: V2b regime-reversal witness
on:
  push:
    paths:
      - 'verification/v2b_regime_reversal_numeric.py'
      - 'verification/v2b_policy_numeric.py'
      - 'verification/requirements_v2b.txt'
      - '.github/workflows/v2b-regime-reversal.yml'
  pull_request:
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r verification/requirements_v2b.txt
      - name: Audit numerical coalition-reversal candidate
        run: python verification/v2b_regime_reversal_numeric.py
