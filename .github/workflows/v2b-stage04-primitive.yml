name: V2b Stage 4 primitive reconstruction
on:
  push:
    paths:
      - 'verification/v2b_stage04_primitive_reconstruction.py'
      - 'verification/requirements_v2b_interval.txt'
      - '.github/workflows/v2b-stage04-primitive.yml'
  pull_request:
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r verification/requirements_v2b_interval.txt
      - name: Independent V2b Stage 4 primitive and best-response diagnostics
        run: python verification/v2b_stage04_primitive_reconstruction.py
